<!doctype html>
<html>
	<head>
		<title>Jump!</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
		<link rel="stylesheet" type="text/css" href="css/style.css?v=mobile-3">
	</head>
	<body>
		<main id="game-shell">
			<canvas id="canvas" width="400" height="600"></canvas>
			<div id="hud">
				<div class="hud-item">
					<span>Score</span>
					<strong id="hud-score-value">0</strong>
				</div>
				<div class="hud-item">
					<span>Best</span>
					<strong id="hud-best-value">0</strong>
				</div>
				<div class="hud-item hud-shield" id="hud-shield">
					<span>Shield</span>
					<strong id="hud-shield-value">Off</strong>
				</div>
			</div>
			<div id="touch-controls" aria-label="Touch controls">
				<div class="touch-row">
					<button id="touch-left" class="touch-button" type="button" aria-label="Move left">‹</button>
					<button id="touch-right" class="touch-button" type="button" aria-label="Move right">›</button>
				</div>
				<button id="touch-jump" class="touch-button touch-jump" type="button" aria-label="Jump">Jump</button>
			</div>
			<div id="mask">
				<section class="menu-panel">
					<h1>Jump!</h1>
					<div id="score"></div>
					<p class="best-line">Best <strong id="best-score">0</strong></p>
					<p class="controls-help">
						<span class="desktop-help">Arrows move. Space jumps.</span>
						<span class="mobile-help">Use the touch buttons to move and jump.</span>
					</p>
					<ul id="menu">
						<li><button id="new-game-button" type="button">New Game</button></li>
					</ul>
				</section>
				<div id="credits">
					Jump! created by <a href="https://github.com/rtcoder">rtCoder</a>
				</div>
			</div>
		</main>
		<script type="module" src="js/main.js?v=module-18"></script>
	</body>
</html>
